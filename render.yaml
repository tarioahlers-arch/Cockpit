# Render Blueprint fuer ShopFil (liegt in shopfil/, unabhaengig von der
# uebrigen App in diesem Repo - siehe shopfil/README.md).
#
# Deploy: Render Dashboard -> New + -> Blueprint -> dieses Repo auswaehlen.
#
# Standardmaessig auf plan: free gestellt - kostenlos, keine Kreditkarte
# noetig, Render unterstuetzt Docker-Web-Services auch auf dem Free-Plan.
# Trade-off: keine Persistent Disk auf dem Free-Plan, d. h. die SQLite-
# Datenbank setzt sich zurueck, sobald der Service nach ca. 15 Minuten
# Inaktivitaet einschlaeft und beim naechsten Aufruf neu startet (auch beim
# Redeploy). Fuer ein kostenloses Ausprobieren/Zeigen der App ist das meist
# unproblematisch. Fuer dauerhaft gespeicherte Daten: siehe Abschnitt
# "Persistente Daten" unten.
services:
  - type: web
    name: shopfil
    env: docker
    plan: free
    dockerContext: ./shopfil
    # dockerfilePath bewusst weggelassen: Render loest ihn relativ zu
    # dockerContext auf (nicht relativ zum Repo-Root, trotz anderslautender
    # Doku) und erwartet damit ohnehin den Default "./Dockerfile" - unsere
    # Datei liegt genau dort (shopfil/Dockerfile). Ein zusaetzlich gesetzter
    # Pfad wie "./shopfil/Dockerfile" fuehrte zu einem doppelten, kaputten
    # Pfad und dem Build-Fehler "failed to read dockerfile: open D: no such
    # file or directory".
    envVars:
      - key: NODE_ENV
        value: production

# --- Persistente Daten (optional, kostet Geld) ---
# Damit die Datenbank Neustarts uebersteht, braucht es einen bezahlten Plan
# mit Persistent Disk. Dafuer oben "plan: free" ersetzen (z. B. "starter")
# und diese Zeilen in den Service-Block einfuegen:
#
#     envVars:
#       - key: DATA_DIR
#         value: /var/data
#     disk:
#       name: shopfil-data
#       mountPath: /var/data
#       sizeGB: 1
