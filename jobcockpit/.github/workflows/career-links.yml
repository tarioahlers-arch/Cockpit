name: Karriereseiten-Links prüfen

on:
  schedule:
    - cron: '17 6 * * 1' # montags 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - supabase/data/career-companies.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-career-urls.mjs
